site_name: Snowplow
site_description: PowerShell module for administering ServiceNow instances
site_url: https://nzmacgeek.github.io/snowplow/
repo_url: https://github.com/nzmacgeek/snowplow
repo_name: nzmacgeek/snowplow
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started.md
      - Authentication: authentication.md
      - Linux notes: linux.md
  - Workflows:
      - Overview: workflows/index.md
      - Incident triage: workflows/incident-triage.md
      - Querying and reporting: workflows/querying-and-reporting.md
      - Bulk updates safely: workflows/bulk-updates.md
      - CMDB investigation: workflows/cmdb.md
      - Comparing instances: workflows/compare-instances.md
      - Troubleshooting with the system log: workflows/syslog.md
      - Unattended automation: workflows/automation.md
  - Cmdlet reference:
      - Overview: cmdlets/index.md
      - Connection:
          - Connect-Snowplow: cmdlets/Connect-Snowplow.md
          - Disconnect-Snowplow: cmdlets/Disconnect-Snowplow.md
          - Add-SnowplowProfile: cmdlets/Add-SnowplowProfile.md
          - Get-SnowplowProfile: cmdlets/Get-SnowplowProfile.md
          - Set-SnowplowProfile: cmdlets/Set-SnowplowProfile.md
          - Remove-SnowplowProfile: cmdlets/Remove-SnowplowProfile.md
          - Get-SnowplowConfiguration: cmdlets/Get-SnowplowConfiguration.md
          - Set-SnowplowConfiguration: cmdlets/Set-SnowplowConfiguration.md
          - Get-SnowplowPromptSegment: cmdlets/Get-SnowplowPromptSegment.md
      - Records:
          - Get-SnowRecord: cmdlets/Get-SnowRecord.md
          - New-SnowRecord: cmdlets/New-SnowRecord.md
          - Set-SnowRecord: cmdlets/Set-SnowRecord.md
          - Remove-SnowRecord: cmdlets/Remove-SnowRecord.md
          - Export-SnowRecord: cmdlets/Export-SnowRecord.md
          - Compare-SnowRecord: cmdlets/Compare-SnowRecord.md
      - Query building:
          - New-SnowQuery: cmdlets/New-SnowQuery.md
          - Find-SnowField: cmdlets/Find-SnowField.md
          - Add-SnowOrderBy: cmdlets/Add-SnowOrderBy.md
          - New-SnowRelativeDate: cmdlets/New-SnowRelativeDate.md
      - Schema and CMDB:
          - Get-SnowTable: cmdlets/Get-SnowTable.md
          - Get-SnowDictionary: cmdlets/Get-SnowDictionary.md
          - Get-SnowCI: cmdlets/Get-SnowCI.md
          - Get-SnowCIRelationship: cmdlets/Get-SnowCIRelationship.md
      - Logs and links:
          - Get-SnowSyslog: cmdlets/Get-SnowSyslog.md
          - Get-SnowLink: cmdlets/Get-SnowLink.md
          - Open-SnowRecord: cmdlets/Open-SnowRecord.md
